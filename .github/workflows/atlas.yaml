# Sovereign Atlas CI.
# NOTE: setup-android v3 failed 60/60 runs at that step and the Unit tests step
# never executed. Upgraded to v4. First green run is still a tracked acceptance
# item.
name: atlas
'on':
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # setup-android's unpinned defaults stopped resolving: 60/60 runs died in
      # this step and never reached the tests. Pin the last known-good
      # cmdline-tools build and ask for exactly what this module needs so the
      # step cannot drift with whatever Google currently publishes.
      # v3 failed 60/60 runs at this step. v4 moved the cmdline-tools default to
      # 15859902 and re-bases on node24, which is what v3's bundled runtime could
      # no longer resolve.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Report toolchain
        run: |
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          sdkmanager --list_installed
      - name: Unit tests
        working-directory: apps/atlas-android
        # gradlew was committed with mode 100644 on a Windows host, so ./gradlew
        # was not executable and this step failed with a permission error. The
        # index now records 100755, and chmod guards the case where a future
        # checkout loses the bit.
        #
        # The step also writes its own diagnosis into the run summary and job
        # log, because the step that fails is not the step whose output explains
        # it: this step's own log is sign-in gated, so a red run was previously
        # undiagnosable without a browser session.
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew :app:testPlayDebugUnitTest :app:testEnterpriseDebugUnitTest \
            --console=plain --continue > gradle-out.log 2>&1
          EXIT=$?
          set -e
          # NOTE: this writes to the run summary, which the run page renders via a
          # JavaScript widget. Reading it back programmatically is not possible
          # here: the step log needs sign-in, the logs endpoint returns 403, and
          # the annotations endpoint does not carry workflow-command output.
          # A signed-in human reading the run page sees this block. Do not add
          # ::error:: duplication hoping to surface it unauthenticated; that does
          # not work and only floods the annotations list.
          {
            echo "### gradlew exit code: $EXIT"
            echo '```'
            grep -nE "FAILED|What went wrong|Execution failed|error:|^e: |Caused by|missing|Tests? .*failed" gradle-out.log | head -60 || echo "(no failure lines matched)"
            echo '```'
            for f in app/build/test-results/*/*.xml; do
              [ -e "$f" ] || continue
              if grep -qE '<(failure|error)' "$f"; then
                echo "--- FAILURES in $f"
                grep -oE '<testcase name="[^"]+"' "$f" | head -20
                grep -oE 'message="[^"]{0,300}' "$f" | head -20
              fi
            done
            for d in testPlayDebugUnitTest testEnterpriseDebugUnitTest; do
              if [ -d "app/build/test-results/$d" ]; then
                echo "### $d XML files: $(ls app/build/test-results/$d/*.xml 2>/dev/null | wc -l)"
              else
                echo "### $d: no results directory (task never ran)"
              fi
            done
            echo '```'
            tail -40 gradle-out.log
            echo '```'
            echo "::endgroup::"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          cat gradle-out.log
          exit $EXIT
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build Release APKs
        working-directory: apps/atlas-android
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +x
          umask 077

          KEYSTORE_DIR=$(mktemp -d)
          trap 'rm -rf "$KEYSTORE_DIR"; rm -f app/google-services.json' EXIT
          base64 -d <<< "$RELEASE_KEYSTORE_BASE64" > "$KEYSTORE_DIR/upload.jks"
          export KEYSTORE_PATH="$KEYSTORE_DIR/upload.jks"

          base64 -d <<< "$GOOGLE_SERVICES_JSON_BASE64" > app/google-services.json

          chmod +x ./gradlew
          ./gradlew :app:assemblePlayRelease :app:assembleEnterpriseRelease -PdisableBuildScans=true --no-daemon --no-configuration-cache
