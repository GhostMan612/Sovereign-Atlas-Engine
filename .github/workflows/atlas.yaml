# Sovereign Atlas CI.
# NOTE: CI was failing at android-actions/setup-android on 60/60 runs; that
# step is now pinned. First green run is still a tracked acceptance item.
name: atlas
'on':
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # setup-android's unpinned defaults stopped resolving: 60/60 runs died in
      # this step and never reached the tests. Pin the last known-good
      # cmdline-tools build and ask for exactly what this module needs so the
      # step cannot drift with whatever Google currently publishes.
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: yes
      - name: Report toolchain
        run: |
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          sdkmanager --list_installed
      - name: Unit tests
        working-directory: apps/atlas-android
        run: ./gradlew :app:testPlayDebugUnitTest :app:testEnterpriseDebugUnitTest --console=plain
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: yes
      - name: Build Release APKs
        working-directory: apps/atlas-android
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +x
          umask 077

          KEYSTORE_DIR=$(mktemp -d)
          trap 'rm -rf "$KEYSTORE_DIR"; rm -f app/google-services.json' EXIT
          base64 -d <<< "$RELEASE_KEYSTORE_BASE64" > "$KEYSTORE_DIR/upload.jks"
          export KEYSTORE_PATH="$KEYSTORE_DIR/upload.jks"

          base64 -d <<< "$GOOGLE_SERVICES_JSON_BASE64" > app/google-services.json

          ./gradlew :app:assemblePlayRelease :app:assembleEnterpriseRelease -PdisableBuildScans=true --no-daemon --no-configuration-cache
