# Sovereign Atlas CI.
# NOTE: setup-android v3 failed 60/60 runs at that step and the Unit tests step
# never executed. Upgraded to v4. First green run is still a tracked acceptance
# item.
name: atlas
'on':
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    # Defense in depth behind the 30-minute Unit tests step timeout and the
    # 15-minute Gradle task timeout: a job that somehow outlives both should
    # fail rather than sit until the 6-hour Actions cap, which kills the runner
    # without letting Gradle write its XML.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # setup-android's unpinned defaults stopped resolving: 60/60 runs died in
      # this step and never reached the tests. Pin the last known-good
      # cmdline-tools build and ask for exactly what this module needs so the
      # step cannot drift with whatever Google currently publishes.
      # v3 failed 60/60 runs at this step. v4 moved the cmdline-tools default to
      # 15859902 and re-bases on node24, which is what v3's bundled runtime could
      # no longer resolve.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Report toolchain
        run: |
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          sdkmanager --list_installed
      - name: Unit tests
        id: unit-tests
        timeout-minutes: 30
        working-directory: apps/atlas-android
        # gradlew was committed with mode 100644 on a Windows host, so ./gradlew
        # was not executable and this step failed with a permission error. The
        # index now records 100755, and chmod guards the case where a future
        # checkout loses the bit.
        #
        # tee keeps gradle-out.log for the artifact upload below. A previous
        # version also grepped that log into the run summary, which was removed
        # once the artifact worked: the summary is a JavaScript widget that
        # cannot be read unauthenticated, whereas ci-test-reports ships the real
        # XML and HTML.
        run: |
          chmod +x ./gradlew
          set +e
          set -o pipefail
          ./gradlew :app:testPlayDebugUnitTest :app:testEnterpriseDebugUnitTest \
            --console=plain \
            --continue \
            --stacktrace \
            --rerun-tasks \
            --no-build-cache \
            2>&1 | tee gradle-out.log
          EXIT=$?
          set -e
          cat gradle-out.log
          exit $EXIT
      # Runs even when Unit tests fails, so a partial or hung run still ships
      # whatever XML and HTML Gradle managed to write before it was killed.
      # if-no-files-found is an error on purpose: a silent zero-file upload
      # reads as success and would hide the very evidence this exists to ship.
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-reports
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/atlas-android/app/build/reports/tests/
            apps/atlas-android/app/build/test-results/
            apps/atlas-android/gradle-out.log
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build Release APKs
        working-directory: apps/atlas-android
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +x
          umask 077

          KEYSTORE_DIR=$(mktemp -d)
          trap 'rm -rf "$KEYSTORE_DIR"; rm -f app/google-services.json' EXIT
          base64 -d <<< "$RELEASE_KEYSTORE_BASE64" > "$KEYSTORE_DIR/upload.jks"
          export KEYSTORE_PATH="$KEYSTORE_DIR/upload.jks"

          base64 -d <<< "$GOOGLE_SERVICES_JSON_BASE64" > app/google-services.json

          chmod +x ./gradlew
          ./gradlew :app:assemblePlayRelease :app:assembleEnterpriseRelease -PdisableBuildScans=true --no-daemon --no-configuration-cache
