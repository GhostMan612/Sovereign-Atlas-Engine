# Sovereign Atlas CI.
# NOTE: UNEXECUTED-ON-CI — first green run on GitHub Actions is itself a
# tracked acceptance item, not assumed.
name: atlas
'on':
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Unit tests
        working-directory: apps/atlas-android
        run: ./gradlew :app:testDebugUnitTest --console=plain
