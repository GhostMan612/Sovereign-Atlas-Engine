# Sovereign Atlas CI.
# NOTE: setup-android v3 failed 60/60 runs at that step and the Unit tests step
# never executed. Upgraded to v4. First green run is still a tracked acceptance
# item.
name: atlas
'on':
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional semver version (e.g. v1.0.0) for release artifact naming; blank uses 1.0-<short-sha>'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Run safe non-signing release preflight without secrets or APK publication'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    # Defense in depth behind the 30-minute Unit tests step timeout and the
    # 15-minute Gradle task timeout: a job that somehow outlives both should
    # fail rather than sit until the 6-hour Actions cap, which kills the runner
    # without letting Gradle write its XML.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # setup-android's unpinned defaults stopped resolving: 60/60 runs died in
      # this step and never reached the tests. Pin the last known-good
      # cmdline-tools build and ask for exactly what this module needs so the
      # step cannot drift with whatever Google currently publishes.
      # v3 failed 60/60 runs at this step. v4 moved the cmdline-tools default to
      # 15859902 and re-bases on node24, which is what v3's bundled runtime could
      # no longer resolve.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Report toolchain
        run: |
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          sdkmanager --list_installed
      - name: Unit tests
        id: unit-tests
        timeout-minutes: 30
        working-directory: apps/atlas-android
        # gradlew was committed with mode 100644 on a Windows host, so ./gradlew
        # was not executable and this step failed with a permission error. The
        # index now records 100755, and chmod guards the case where a future
        # checkout loses the bit.
        #
        # tee keeps gradle-out.log for the artifact upload below. A previous
        # version also grepped that log into the run summary, which was removed
        # once the artifact worked: the summary is a JavaScript widget that
        # cannot be read unauthenticated, whereas ci-test-reports ships the real
        # XML and HTML.
        run: |
          chmod +x ./gradlew
          set +e
          set -o pipefail
          ./gradlew :atlas-sdk:test :sdk-consumer:test \
            :app:testPlayDebugUnitTest :app:testEnterpriseDebugUnitTest \
            --console=plain \
            --continue \
            --stacktrace \
            --rerun-tasks \
            --no-build-cache \
            2>&1 | tee gradle-out.log
          EXIT=$?
          set -e
          exit $EXIT
      - name: Test distribution hold
        working-directory: apps/atlas-android
        run: ./gradlew atlasDistributionGateTest --console=plain
      # Runs even when Unit tests fails, so a partial or hung run still ships
      # whatever XML and HTML Gradle managed to write before it was killed.
      # if-no-files-found is an error on purpose: a silent zero-file upload
      # reads as success and would hide the very evidence this exists to ship.
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-reports
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/atlas-android/app/build/reports/tests/
            apps/atlas-android/app/build/test-results/
            apps/atlas-android/atlas-sdk/build/reports/tests/
            apps/atlas-android/atlas-sdk/build/test-results/
            apps/atlas-android/sdk-consumer/build/reports/tests/
            apps/atlas-android/sdk-consumer/build/test-results/
            apps/atlas-android/gradle-out.log
  sdk-consumer-maven:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK for publishing host build
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Publish atlas-sdk to temporary Maven repository
        id: publish-sdk
        working-directory: apps/atlas-android
        run: |
          chmod +x ./gradlew
          REPO_DIR="$GITHUB_WORKSPACE/apps/atlas-android/build/atlas-private-verification/repository"
          ./gradlew :atlas-sdk:publishMavenJavaPublicationToVerificationRepository \
            --console=plain \
            --no-build-cache \
            --no-daemon
          ARTIFACT_DIR="$REPO_DIR/com/sovereignatlas/atlas-sdk/1.1.0"
          test -f "$ARTIFACT_DIR/atlas-sdk-1.1.0.jar"
          test -f "$ARTIFACT_DIR/atlas-sdk-1.1.0.pom"
          test -f "$ARTIFACT_DIR/atlas-sdk-1.1.0.module"
          echo "repo_dir=$REPO_DIR" >> "$GITHUB_OUTPUT"
      - name: Verify standalone Maven consumer in isolated directory
        run: |
          REPO_DIR="${{ steps.publish-sdk.outputs.repo_dir }}"
          ISO_BASE=$(mktemp -d)
          ISO_CONSUMER="$ISO_BASE/sdk-consumer"
          EMPTY_REPO="$ISO_BASE/empty-repo"
          NO_JAR_REPO="$ISO_BASE/no-jar-repo"
          NO_META_REPO="$ISO_BASE/no-meta-repo"
          mkdir -p "$ISO_CONSUMER" "$EMPTY_REPO" "$NO_JAR_REPO" "$NO_META_REPO"
          cp -R samples/sdk-consumer/. "$ISO_CONSUMER/"
          cp -R "$REPO_DIR/." "$NO_JAR_REPO/"
          cp -R "$REPO_DIR/." "$NO_META_REPO/"
          rm -f "$NO_JAR_REPO"/com/sovereignatlas/atlas-sdk/1.1.0/*.jar*
          rm -f "$NO_META_REPO"/com/sovereignatlas/atlas-sdk/1.1.0/*.pom*
          rm -f "$NO_META_REPO"/com/sovereignatlas/atlas-sdk/1.1.0/*.module*
          rm -f "$NO_META_REPO"/com/sovereignatlas/atlas-sdk/maven-metadata*

          unset ANDROID_HOME ANDROID_SDK_ROOT
          cd "$ISO_CONSUMER"
          chmod +x ./gradlew
          ! grep -rnE "project\(':atlas-sdk'\)|includeBuild\(" settings.gradle build.gradle

          assert_resolution_fails() {
            local label="$1"
            shift
            set +e
            local out
            out=$("$@" 2>&1)
            local rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "ERROR: Expected resolution failure ($label) but Gradle exited 0"
              echo "$out"
              exit 1
            fi
            if ! printf '%s' "$out" | grep -qE "Could not (find|resolve) (com\.sovereignatlas:atlas-sdk|atlas-sdk-1\.1\.0)"; then
              echo "ERROR: Failure ($label) did not report missing SDK artifact or metadata"
              echo "$out"
              exit 1
            fi
            echo "PASS negative check ($label): failed cleanly"
          }

          assert_resolution_fails "no-repo" ./gradlew test --no-daemon --console=plain
          assert_resolution_fails "empty-repo" ./gradlew test --no-daemon --console=plain -PatlasSdkRepo="$EMPTY_REPO"
          assert_resolution_fails "missing-jar" ./gradlew test --no-daemon --console=plain -PatlasSdkRepo="$NO_JAR_REPO"
          assert_resolution_fails "missing-metadata" ./gradlew test --no-daemon --console=plain -PatlasSdkRepo="$NO_META_REPO"

          ./gradlew dependencies --configuration runtimeClasspath --no-daemon --console=plain -PatlasSdkRepo="$REPO_DIR" > runtime-deps.txt
          grep -q "com.sovereignatlas:atlas-sdk:1.1.0" runtime-deps.txt
          ! grep -qiE "com\.android\.|androidx\.|org\.maplibre|com\.google\.firebase" runtime-deps.txt

          set +e
          ./gradlew test --no-daemon --no-build-cache --rerun-tasks --console=plain -PatlasSdkRepo="$REPO_DIR" 2>&1 | tee gradle-out.log
          EXIT=$?
          set -e
          mkdir -p "$GITHUB_WORKSPACE/sdk-consumer-maven-reports"
          cp -R build/reports/tests "$GITHUB_WORKSPACE/sdk-consumer-maven-reports/reports-tests" || true
          cp -R build/test-results "$GITHUB_WORKSPACE/sdk-consumer-maven-reports/test-results" || true
          cp runtime-deps.txt gradle-out.log "$GITHUB_WORKSPACE/sdk-consumer-maven-reports/" || true
          exit "$EXIT"
      - name: Upload Standalone Consumer Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-sdk-consumer-maven-reports
          if-no-files-found: error
          retention-days: 7
          path: sdk-consumer-maven-reports/
  release:
    needs:
      - verify
      - sdk-consumer-maven
    runs-on: ubuntu-latest
    environment: distribution-release
    timeout-minutes: 45
    permissions:
      contents: write
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    steps:
      - name: Validate release ref and metadata
        id: meta
        env:
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          IS_DRY_RUN="false"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${INPUT_DRY_RUN:-false}" = "true" ]; then
            IS_DRY_RUN="true"
          fi

          validate_semver() {
            local raw="$1"
            if [[ ! "$raw" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "ERROR: Invalid semver release tag '$raw' (expected vMAJOR.MINOR.PATCH[-PRERELEASE])."
              exit 1
            fi
            local stripped="${raw#v}"
            local core="${stripped%%-*}"
            local major minor patch
            IFS='.' read -r major minor patch <<< "$core"
            if [ "$((10#$major))" -gt 200000 ] || [ "$((10#$minor))" -ge 100 ] || [ "$((10#$patch))" -ge 100 ]; then
              echo "ERROR: Semver numbers out of Android versionCode bounds for '$raw'."
              exit 1
            fi
            local code=$(( 10#$major * 10000 + 10#$minor * 100 + 10#$patch ))
            if [ "$code" -lt 1 ]; then
              echo "ERROR: Computed versionCode must be >= 1 for '$raw'."
              exit 1
            fi
            VALIDATED_VERSION_NAME="$stripped"
            VALIDATED_VERSION_CODE="$code"
          }

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
              echo "ERROR: Tag release triggered on unexpected ref '$GITHUB_REF'."
              exit 1
            fi
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            validate_semver "$TAG_NAME"
            VERSION_NAME="$VALIDATED_VERSION_NAME"
            VERSION_CODE="$VALIDATED_VERSION_CODE"
            VERSION_LABEL="$TAG_NAME"
            ARTIFACT_SUFFIX="$TAG_NAME"
            IS_TAG_RELEASE="true"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "ERROR: Manual release dispatch is restricted to refs/heads/main (got '$GITHUB_REF')."
              exit 1
            fi
            TAG_NAME=""
            TRIMMED_VER=$(printf '%s' "${INPUT_RELEASE_VERSION:-}" | tr -d '[:space:]')
            if [ -n "$TRIMMED_VER" ]; then
              NORMALIZED="$TRIMMED_VER"
              if [[ "$NORMALIZED" != v* ]]; then
                NORMALIZED="v${NORMALIZED}"
              fi
              validate_semver "$NORMALIZED"
              VERSION_NAME="${VALIDATED_VERSION_NAME}-${SHORT_SHA}"
              VERSION_CODE="$VALIDATED_VERSION_CODE"
              VERSION_LABEL="v${VALIDATED_VERSION_NAME}-${SHORT_SHA}"
              ARTIFACT_SUFFIX="manual-v${VALIDATED_VERSION_NAME}-${SHORT_SHA}"
            else
              VERSION_NAME="1.0-${SHORT_SHA}"
              VERSION_CODE="1"
              VERSION_LABEL="v1.0-${SHORT_SHA}"
              ARTIFACT_SUFFIX="manual-${SHORT_SHA}"
            fi
            IS_TAG_RELEASE="false"
          else
            echo "ERROR: Unsupported event for release job: $GITHUB_EVENT_NAME"
            exit 1
          fi

          {
            echo "is_dry_run=$IS_DRY_RUN"
            echo "is_tag_release=$IS_TAG_RELEASE"
            echo "tag_name=$TAG_NAME"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "version_label=$VERSION_LABEL"
            echo "artifact_suffix=$ARTIFACT_SUFFIX"
            echo "short_sha=$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Dry-run fail-closed signing preflight
        if: steps.meta.outputs.is_dry_run == 'true'
        working-directory: apps/atlas-android
        env:
          DRY_RUN_VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          DRY_RUN_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          DRY_RUN_VERSION_LABEL: ${{ steps.meta.outputs.version_label }}
        run: |
          set -euo pipefail
          unset KEYSTORE_PATH KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD RELEASE_KEYSTORE_BASE64 GOOGLE_SERVICES_JSON_BASE64 || true
          if [ -e app/keystore.properties ] || [ -e app/google-services.json ]; then
            echo "ERROR: Unexpected credential file present in clean checkout."
            exit 1
          fi
          chmod +x ./gradlew
          set +e
          OUT=$(./gradlew :app:assemblePlayRelease \
            -PATLAS_VERSION_NAME="$DRY_RUN_VERSION_NAME" \
            -PATLAS_VERSION_CODE="$DRY_RUN_VERSION_CODE" \
            -PdisableBuildScans=true \
            --no-daemon \
            --no-configuration-cache 2>&1)
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "ERROR: Expected fail-closed signing failure during unsigned dry-run, but Gradle exited 0."
            exit 1
          fi
          if ! printf '%s' "$OUT" | grep -q "FAIL-CLOSED"; then
            echo "ERROR: Gradle failed without FAIL-CLOSED signing guard message."
            printf '%s\n' "$OUT"
            exit 1
          fi
          if find app/build -type f -name '*.apk' 2>/dev/null | grep -q .; then
            echo "ERROR: Unsigned APK found during dry-run preflight."
            exit 1
          fi
          OUT_DIR="$GITHUB_WORKSPACE/release-dry-run"
          mkdir -p "$OUT_DIR"
          python3 - <<'PY' "$OUT_DIR/dry-run-manifest.json" "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" "$DRY_RUN_VERSION_LABEL"
          import json, sys
          path, sha, ref, run_id, label = sys.argv[1:6]
          with open(path, 'w', encoding='utf-8') as f:
              json.dump({
                  "schema": "sovereign-atlas-release-dry-run/v1",
                  "dry_run": True,
                  "commit_sha": sha,
                  "ref": ref,
                  "workflow_run_id": run_id,
                  "version_label": label,
                  "fail_closed_signing_verified": True,
                  "apks_published": [],
              }, f, indent=2)
              f.write("\n")
          PY
      - name: Upload Dry-Run Preflight Report
        if: steps.meta.outputs.is_dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run-${{ steps.meta.outputs.artifact_suffix }}
          if-no-files-found: error
          retention-days: 7
          path: release-dry-run/
      - name: Build and verify signed Release APKs
        if: steps.meta.outputs.is_dry_run != 'true'
        working-directory: apps/atlas-android
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          RELEASE_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          RELEASE_VERSION_LABEL: ${{ steps.meta.outputs.version_label }}
        run: |
          set +x
          set -euo pipefail
          umask 077

          for req_var in GOOGLE_SERVICES_JSON_BASE64 RELEASE_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!req_var:-}" ]; then
              echo "ERROR: Required release secret '$req_var' is missing or empty. Halting before packaging."
              exit 1
            fi
          done

          KEYSTORE_DIR=$(mktemp -d)
          cleanup() {
            rm -rf "$KEYSTORE_DIR"
            rm -f app/google-services.json
          }
          trap cleanup EXIT

          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > "$KEYSTORE_DIR/upload.jks"
          if [ ! -s "$KEYSTORE_DIR/upload.jks" ]; then
            echo "ERROR: Decoded release keystore is empty."
            exit 1
          fi
          export KEYSTORE_PATH="$KEYSTORE_DIR/upload.jks"

          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n' | base64 -d > app/google-services.json
          if [ ! -s app/google-services.json ]; then
            echo "ERROR: Decoded google-services.json is empty."
            exit 1
          fi
          python3 -m json.tool app/google-services.json > /dev/null

          chmod +x ./gradlew
          ./gradlew :app:assemblePlayRelease :app:assembleEnterpriseRelease \
            -PATLAS_VERSION_NAME="$RELEASE_VERSION_NAME" \
            -PATLAS_VERSION_CODE="$RELEASE_VERSION_CODE" \
            -PdisableBuildScans=true \
            --no-daemon \
            --no-configuration-cache

          cleanup
          trap - EXIT
          unset KEYSTORE_PATH KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD RELEASE_KEYSTORE_BASE64 GOOGLE_SERVICES_JSON_BASE64

          if find app/build/outputs/apk -type f -name '*-unsigned.apk' 2>/dev/null | grep -q .; then
            echo "ERROR: Unsigned APK detected in outputs; refusing to publish."
            exit 1
          fi

          PLAY_APK="app/build/outputs/apk/play/release/app-play-release.apk"
          ENT_APK="app/build/outputs/apk/enterprise/release/app-enterprise-release.apk"
          test -s "$PLAY_APK"
          test -s "$ENT_APK"

          APKSIGNER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner executable not found at $APKSIGNER"
            exit 1
          fi

          PLAY_CERT_OUT=$("$APKSIGNER" verify --verbose --print-certs "$PLAY_APK" 2>&1)
          ENT_CERT_OUT=$("$APKSIGNER" verify --verbose --print-certs "$ENT_APK" 2>&1)

          STAGE_DIR="$GITHUB_WORKSPACE/release-artifacts"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"
          PLAY_DEST="sovereign-atlas-play-${RELEASE_VERSION_LABEL}.apk"
          ENT_DEST="sovereign-atlas-enterprise-${RELEASE_VERSION_LABEL}.apk"
          cp "$PLAY_APK" "$STAGE_DIR/$PLAY_DEST"
          cp "$ENT_APK" "$STAGE_DIR/$ENT_DEST"

          python3 - <<'PY' "$STAGE_DIR" "$PLAY_DEST" "$ENT_DEST" "$PLAY_CERT_OUT" "$ENT_CERT_OUT" "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ID" "$RELEASE_VERSION_NAME" "$RELEASE_VERSION_CODE" "$RELEASE_VERSION_LABEL"
          import hashlib, json, os, re, sys, zipfile

          (stage_dir, play_name, ent_name, play_cert_out, ent_cert_out,
           sha, ref, event_name, run_id, ver_name, ver_code, ver_label) = sys.argv[1:13]

          forbidden_names = {"keystore.properties", "google-services.json", ".env"}
          forbidden_exts = (".jks", ".keystore", ".pem", ".key")

          def check_zip(apk_path):
              with zipfile.ZipFile(apk_path, "r") as zf:
                  for member in zf.namelist():
                      base = os.path.basename(member).lower()
                      if base in forbidden_names or base.startswith(".env.") or base.endswith(forbidden_exts):
                          raise SystemExit(f"ERROR: Forbidden secret-like entry inside {apk_path}: {member}")

          def extract_cert_sha256(cert_output, label):
              m = re.search(r"Signer #1 certificate SHA-256 digest:\s*([0-9a-fA-F]{64})", cert_output)
              if not m:
                  raise SystemExit(f"ERROR: Missing Signer #1 SHA-256 certificate digest in apksigner output for {label}")
              return m.group(1).lower()

          for entry in os.listdir(stage_dir):
              low = entry.lower()
              if low in forbidden_names or low.startswith(".env.") or low.endswith(forbidden_exts):
                  raise SystemExit(f"ERROR: Forbidden secret-like file in staged release artifacts: {entry}")

          play_path = os.path.join(stage_dir, play_name)
          ent_path = os.path.join(stage_dir, ent_name)
          check_zip(play_path)
          check_zip(ent_path)

          play_cert = extract_cert_sha256(play_cert_out, play_name)
          ent_cert = extract_cert_sha256(ent_cert_out, ent_name)
          if play_cert != ent_cert:
              raise SystemExit(f"ERROR: Play and Enterprise APKs signed by mismatched certificates ({play_cert} vs {ent_cert})")

          artifacts = []
          sums_lines = []
          for variant, fname in (("play", play_name), ("enterprise", ent_name)):
              fpath = os.path.join(stage_dir, fname)
              h = hashlib.sha256()
              with open(fpath, "rb") as f:
                  for chunk in iter(lambda: f.read(65536), b""):
                      h.update(chunk)
              digest = h.hexdigest()
              size = os.path.getsize(fpath)
              sums_lines.append(f"{digest}  {fname}\n")
              artifacts.append({
                  "variant": variant,
                  "file": fname,
                  "bytes": size,
                  "sha256": digest,
                  "apksigner_cert_sha256": play_cert if variant == "play" else ent_cert,
              })

          with open(os.path.join(stage_dir, "SHA256SUMS.txt"), "w", encoding="utf-8") as f:
              f.writelines(sums_lines)

          manifest = {
              "schema": "sovereign-atlas-release-manifest/v1",
              "commit_sha": sha,
              "ref": ref,
              "event_name": event_name,
              "workflow_run_id": run_id,
              "version_name": ver_name,
              "version_code": int(ver_code),
              "version_label": ver_label,
              "artifacts": artifacts,
          }
          with open(os.path.join(stage_dir, "release-manifest.json"), "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY

          (cd "$STAGE_DIR" && sha256sum -c SHA256SUMS.txt)
      - name: Validate signed artifact disposition
        if: steps.meta.outputs.is_dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ATLAS_REVIEWER_ID: ${{ vars.ATLAS_DISTRIBUTION_REVIEWER_ID }}
          ATLAS_REVIEWER_PUBLIC_KEY: ${{ secrets.ATLAS_DISTRIBUTION_REVIEWER_PUBLIC_KEY }}
          PLAY_APPROVAL: ${{ secrets.ATLAS_PLAY_APPROVAL_BASE64 }}
          PLAY_SIGNATURE: ${{ secrets.ATLAS_PLAY_SIGNATURE_BASE64 }}
          ENTERPRISE_APPROVAL: ${{ secrets.ATLAS_ENTERPRISE_APPROVAL_BASE64 }}
          ENTERPRISE_SIGNATURE: ${{ secrets.ATLAS_ENTERPRISE_SIGNATURE_BASE64 }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/distribution-release" | jq -e '
            (.protection_rules | any(.type == "required_reviewers" and .prevent_self_review == true and (.reviewers | length > 0))) and
            (.deployment_branch_policy.protected_branches == true or .deployment_branch_policy.custom_branch_policies == true)
          ' > /dev/null || { echo "Protected distribution environment cannot be verified"; exit 1; }
          umask 077
          evidence_dir=$(mktemp -d "$RUNNER_TEMP/atlas-evidence.XXXXXXXX")
          trap 'rm -rf "$evidence_dir"' EXIT
          for name in ATLAS_REVIEWER_ID ATLAS_REVIEWER_PUBLIC_KEY PLAY_APPROVAL PLAY_SIGNATURE ENTERPRISE_APPROVAL ENTERPRISE_SIGNATURE; do
            if [ -z "${!name:-}" ]; then echo "Missing protected distribution evidence: $name"; exit 1; fi
          done
          printf '%s' "$PLAY_APPROVAL" | base64 --decode > "$evidence_dir/play.json"
          printf '%s' "$PLAY_SIGNATURE" | base64 --decode > "$evidence_dir/play.sig"
          printf '%s' "$ENTERPRISE_APPROVAL" | base64 --decode > "$evidence_dir/enterprise.json"
          printf '%s' "$ENTERPRISE_SIGNATURE" | base64 --decode > "$evidence_dir/enterprise.sig"
          git archive --format=zip HEAD > "$evidence_dir/source.zip"
          play=("$GITHUB_WORKSPACE"/release-artifacts/sovereign-atlas-play-*.apk)
          enterprise=("$GITHUB_WORKSPACE"/release-artifacts/sovereign-atlas-enterprise-*.apk)
          [ ${#play[@]} -eq 1 ] && [ -f "${play[0]}" ]
          [ ${#enterprise[@]} -eq 1 ] && [ -f "${enterprise[0]}" ]
          export ATLAS_EVIDENCE_DIR="$evidence_dir" ATLAS_SOURCE_ARCHIVE="$evidence_dir/source.zip"
          export ATLAS_PLAY_ARTIFACT="${play[0]}" ATLAS_ENTERPRISE_ARTIFACT="${enterprise[0]}"
          cd apps/atlas-android
          ./gradlew atlasDistributionGate --console=plain --no-daemon
      - name: Upload distribution audit report
        if: always() && steps.meta.outputs.is_dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: distribution-audit-${{ steps.meta.outputs.artifact_suffix }}
          if-no-files-found: ignore
          retention-days: 7
          path: apps/atlas-android/build/reports/distribution/
      - name: Ensure ephemeral credentials removed
        if: always() && steps.meta.outputs.is_dry_run != 'true'
        run: rm -f apps/atlas-android/app/google-services.json
      - name: Recheck approved release artifact hashes
        if: steps.meta.outputs.is_dry_run != 'true'
        run: (cd release-artifacts && sha256sum -c SHA256SUMS.txt)
      - name: Upload Signed Release APKs
        if: steps.meta.outputs.is_dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-apks-${{ steps.meta.outputs.artifact_suffix }}
          if-no-files-found: error
          retention-days: 90
          path: release-artifacts/
      - name: Publish GitHub Release for Semver Tag
        if: steps.meta.outputs.is_dry_run != 'true' && steps.meta.outputs.is_tag_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
        run: |
          set -euo pipefail
          test -f "release-artifacts/SHA256SUMS.txt"
          test -f "release-artifacts/release-manifest.json"
          PRERELEASE_FLAG=()
          if [[ "$TAG_NAME" == *-* ]]; then
            PRERELEASE_FLAG+=(--prerelease)
          fi
          gh release create "$TAG_NAME" \
            release-artifacts/*.apk \
            release-artifacts/SHA256SUMS.txt \
            release-artifacts/release-manifest.json \
            --verify-tag \
            --title "Sovereign Atlas $TAG_NAME" \
            --generate-notes \
            "${PRERELEASE_FLAG[@]}"
