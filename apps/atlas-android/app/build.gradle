plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = "com.sovereignatlas.atlas"
    compileSdk = 35

    defaultConfig {
        applicationId = "com.sovereignatlas.atlas"
        minSdk = 30
        targetSdk = 35
        versionCode = 1
        versionName = "1.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    // Release signing resolution: keystore.properties (module dir) first,
    // -PKEYSTORE_* project properties second, KEYSTORE_* environment
    // variables third. Unsigned release is never emitted silently —
    // see the fail-closed guard below.
    def keystoreFile = file("keystore.properties")
    def keystoreProps = new Properties()
    if (keystoreFile.exists()) {
        keystoreFile.withInputStream { stream -> keystoreProps.load(stream) }
    }
    def releaseStorePath = keystoreProps.getProperty("storeFile") ?: project.findProperty("KEYSTORE_PATH") ?: System.getenv("KEYSTORE_PATH")
    def releaseStorePassword = keystoreProps.getProperty("storePassword") ?: project.findProperty("KEYSTORE_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD")
    def releaseKeyAlias = keystoreProps.getProperty("keyAlias") ?: project.findProperty("KEY_ALIAS") ?: System.getenv("KEY_ALIAS")
    def releaseKeyPassword = keystoreProps.getProperty("keyPassword") ?: project.findProperty("KEY_PASSWORD") ?: System.getenv("KEY_PASSWORD")
    def hasReleaseSigning = releaseStorePath != null && releaseStorePassword != null &&
        releaseKeyAlias != null && releaseKeyPassword != null

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    flavorDimensions "distribution"
    productFlavors {
        play {
            dimension "distribution"
        }
        enterprise {
            dimension "distribution"
            applicationIdSuffix ".enterprise"
        }
    }

    buildTypes {
        debug {
            debuggable = true
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Fail-closed: any release task in the execution graph without
    // credentials fails before packaging can emit an unsigned artifact.
    gradle.taskGraph.whenReady { taskGraph ->
        def isRelease = taskGraph.allTasks.any { it.name.toLowerCase().contains("release") }

        def hasProps = project.file('apps/atlas-android/app/keystore.properties').exists() || project.file('keystore.properties').exists()
        def hasExt = project.hasProperty('KEYSTORE_PATH')
        def hasEnv = System.getenv('KEYSTORE_PATH') != null

        if (isRelease && !hasProps && !hasExt && !hasEnv) {
            throw new GradleException("FAIL-CLOSED: Release signing credentials missing. Halting before packaging.")
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        compose = true
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'org.maplibre.gl:android-sdk:13.3.1'

    testImplementation 'junit:junit:4.13.2'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.7.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
