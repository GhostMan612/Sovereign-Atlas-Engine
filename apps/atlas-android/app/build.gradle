plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'app.cash.sqldelight' version '2.1.0'
    id 'com.squareup.wire'
}

wire {
    kotlin {}
}

sqldelight {
    databases {
        AtlasDatabase {
            packageName = 'com.sovereignatlas.atlas.db'
            // ADR-007. Without an explicit version this stays 1 forever and
            // CREATE TABLE IF NOT EXISTS is a no-op against an existing table, so a
            // new column compiles into an insert that names a column the device
            // does not have. Bump this in the same commit as any .sq change AND ship
            // the matching .sqm script.
            version = 2
        }
    }
}

android {
    namespace = "com.sovereignatlas.atlas"
    compileSdk = 35

    def versionNameOverride = (project.findProperty("ATLAS_VERSION_NAME") ?: System.getenv("ATLAS_VERSION_NAME"))?.toString()?.trim()
    def versionCodeOverrideRaw = (project.findProperty("ATLAS_VERSION_CODE") ?: System.getenv("ATLAS_VERSION_CODE"))?.toString()?.trim()
    def resolvedVersionName = (versionNameOverride != null && !versionNameOverride.isEmpty()) ? versionNameOverride : "1.0"
    def resolvedVersionCode = (versionCodeOverrideRaw != null && !versionCodeOverrideRaw.isEmpty()) ? versionCodeOverrideRaw.toInteger() : 1

    defaultConfig {
        applicationId = "com.sovereignatlas.atlas"
        minSdk = 30
        targetSdk = 35
        versionCode = resolvedVersionCode
        versionName = resolvedVersionName
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    // Release signing resolution: keystore.properties (module dir) first,
    // -PKEYSTORE_* project properties second, KEYSTORE_* environment
    // variables third. Unsigned release is never emitted silently —
    // see the fail-closed guard below.
    def keystoreFile = file("keystore.properties")
    def keystoreProps = new Properties()
    if (keystoreFile.exists()) {
        keystoreFile.withInputStream { stream -> keystoreProps.load(stream) }
    }
    def releaseStorePath = (keystoreProps.getProperty("storeFile") ?: project.findProperty("KEYSTORE_PATH") ?: System.getenv("KEYSTORE_PATH"))?.toString()?.trim()
    def releaseStorePassword = (keystoreProps.getProperty("storePassword") ?: project.findProperty("KEYSTORE_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD"))?.toString()
    def releaseKeyAlias = (keystoreProps.getProperty("keyAlias") ?: project.findProperty("KEY_ALIAS") ?: System.getenv("KEY_ALIAS"))?.toString()?.trim()
    def releaseKeyPassword = (keystoreProps.getProperty("keyPassword") ?: project.findProperty("KEY_PASSWORD") ?: System.getenv("KEY_PASSWORD"))?.toString()
    def resolvedKeystoreFile = (releaseStorePath != null && !releaseStorePath.isEmpty()) ? file(releaseStorePath) : null
    def hasValidKeystoreFile = resolvedKeystoreFile != null && resolvedKeystoreFile.isFile() && resolvedKeystoreFile.length() > 0L
    def hasReleaseSigning =
        hasValidKeystoreFile &&
        releaseStorePassword != null && !releaseStorePassword.isEmpty() &&
        releaseKeyAlias != null && !releaseKeyAlias.isEmpty() &&
        releaseKeyPassword != null && !releaseKeyPassword.isEmpty()

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile resolvedKeystoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    flavorDimensions "distribution"
    productFlavors {
        play {
            dimension "distribution"
        }
        enterprise {
            dimension "distribution"
            applicationIdSuffix ".enterprise"
        }
    }

    buildTypes {
        debug {
            debuggable = true
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        candidate {
            initWith release
            signingConfig null
            matchingFallbacks = ['release']
        }
    }

    // Fail-closed: any release task in the execution graph without complete,
    // non-empty credentials and a non-empty keystore file fails before packaging
    // can emit an unsigned artifact.
    gradle.taskGraph.whenReady { taskGraph ->
        def isRelease = taskGraph.allTasks.any { it.name.toLowerCase().contains("release") }

        if (isRelease && !hasReleaseSigning) {
            throw new GradleException(
                "FAIL-CLOSED: Release signing credentials missing. Halting before packaging."
            )
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        compose = true
    }
}

dependencies {
    implementation project(':atlas-sdk')
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'app.cash.sqldelight:android-driver:2.1.0'
    implementation 'app.cash.sqldelight:coroutines-extensions:2.1.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.datastore:datastore-preferences:1.3.0-alpha11'
    implementation 'androidx.datastore:datastore-tink:1.3.0-alpha11'
    implementation 'com.google.crypto.tink:tink-android:1.23.0'
    implementation 'com.squareup.wire:wire-runtime:6.4.7'
    // Runtime only: Json.parseToJsonElement is not a compiler-plugin API, so the
    // kotlinx-serialization plugin block is deliberately NOT applied.
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
    implementation platform('com.google.firebase:firebase-bom:33.16.0')
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'mil.nga:mgrs:2.1.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'
    implementation 'org.maplibre.gl:android-sdk:13.3.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.1'
    testImplementation 'app.cash.sqldelight:sqlite-driver:2.1.0'
    testImplementation 'com.google.crypto.tink:tink:1.23.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.7.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

// The google-services plugin hard-fails at configuration time when the file is
// absent, which broke the CI unit-test step: the file is gitignored by
// RULES.md 1.3, so it never exists on a clean checkout. Only wire the plugin up
// when the file is actually present, so assemble and unit tests work without a
// credential. The release job writes the real file before assembling, and it
// still gets the plugin.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

tasks.withType(Test).configureEach {
    testLogging {
        events "started", "passed", "skipped", "failed", "standardOut", "standardError"
        exceptionFormat "full"
        showExceptions true
        showCauses true
        showStackTraces true
    }
    // Without a task-level timeout a hung test runs until the Actions job cap
    // fires, and when Actions kills the job Gradle writes no JUnit XML, emits no
    // thread dump, and the artifact upload has nothing to ship. The timeout is
    // what makes the diagnostic artifact exist at all.
    timeout = java.time.Duration.ofMinutes(15)
}
