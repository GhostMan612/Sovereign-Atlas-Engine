plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
    id 'maven-publish'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.1'
}

def atlasVerifyRepoProp = providers.gradleProperty('atlasVerifyRepo').orNull
def atlasVerifyRepoUri = (atlasVerifyRepoProp != null && !atlasVerifyRepoProp.trim().isEmpty()) ? {
    def candidate = new File(atlasVerifyRepoProp.trim())
    return (candidate.isAbsolute() ? candidate : new File(rootProject.projectDir, atlasVerifyRepoProp.trim())).toURI()
}() : layout.buildDirectory.dir('verification-repo').get().asFile.toURI()

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'com.sovereignatlas'
            artifactId = 'atlas-sdk'
            version = '1.1.0'
        }
    }
    repositories {
        maven {
            name = 'verification'
            url = atlasVerifyRepoUri
        }
    }
}

tasks.withType(Test).configureEach {
    testLogging {
        events "started", "passed", "skipped", "failed"
        showExceptions true
        showStackTraces true
    }
}
