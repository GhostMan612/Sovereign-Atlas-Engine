import java.nio.file.Files
import java.nio.file.attribute.PosixFileAttributeView
import java.nio.file.attribute.PosixFilePermissions
import java.nio.file.attribute.AclFileAttributeView
import java.nio.file.attribute.AclEntry
import java.nio.file.attribute.AclEntryType
import java.nio.file.attribute.AclEntryPermission
import java.nio.file.attribute.AclEntryFlag

plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
    id 'com.squareup.wire'
    id 'maven-publish'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "17"
    }
}

wire {
    kotlin {
        includes = ['meshtastic.*']
        boxOneOfsMinSize = 5000
    }
}

dependencies {
    api 'com.squareup.wire:wire-runtime:6.4.7'
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.1'
}

if (providers.gradleProperty('atlasVerifyRepo').isPresent()) {
    throw new GradleException('Custom verification repository paths are prohibited')
}
def verificationRoot = rootProject.layout.buildDirectory.dir('atlas-private-verification').get().asFile.absoluteFile
def verificationRepo = new File(verificationRoot, 'repository')

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'com.sovereignatlas'
            artifactId = 'atlas-sdk'
            version = '1.1.0'
        }
    }
    repositories {
        maven {
            name = 'verification'
            url = verificationRepo.toURI()
        }
    }
}

tasks.withType(org.gradle.api.publish.maven.tasks.PublishToMavenRepository).configureEach {
    doFirst {
        def problems = rootProject.ext.validateVerificationPath(verificationRepo, verificationRoot)
        if (!problems.isEmpty()) throw new GradleException(problems.join('; '))
        Files.createDirectories(verificationRoot.toPath())
        problems = rootProject.ext.validateVerificationPath(verificationRepo, verificationRoot)
        if (!problems.isEmpty()) throw new GradleException(problems.join('; '))
        def store = Files.getFileStore(verificationRoot.toPath())
        def type = store.type().toLowerCase(Locale.ROOT)
        if (type.contains('nfs') || type.contains('cifs') || type.contains('smb') || type.contains('sshfs') || store.name().startsWith('\\\\')) {
            throw new GradleException('Verification repository must use a local private filesystem')
        }
        def path = verificationRoot.toPath()
        def user = path.fileSystem.userPrincipalLookupService.lookupPrincipalByName(System.getProperty('user.name'))
        if (Files.getOwner(path) != user) {
            throw new GradleException('Verification repository owner differs from the current user')
        }
        def posix = Files.getFileAttributeView(path, PosixFileAttributeView)
        def acl = Files.getFileAttributeView(path, AclFileAttributeView)
        if (posix != null) {
            posix.setPermissions(PosixFilePermissions.fromString('rwx------'))
        } else if (acl != null) {
            def owner = Files.getOwner(path)
            def entry = AclEntry.newBuilder().setType(AclEntryType.ALLOW)
                .setPrincipal(owner).setPermissions(AclEntryPermission.values() as Set)
                .setFlags(AclEntryFlag.FILE_INHERIT, AclEntryFlag.DIRECTORY_INHERIT).build()
            acl.setAcl([entry])
        } else {
            throw new GradleException('Cannot establish private permissions for verification repository')
        }
    }
}

tasks.withType(Test).configureEach {
    testLogging {
        events "started", "passed", "skipped", "failed"
        showExceptions true
        showStackTraces true
    }
}
